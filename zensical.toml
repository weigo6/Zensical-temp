# Bug Report: TOC Navigation Requires Double-Click with Instant Navigation and Site URL enabled
# Encountered in Zensical 0.0.31 and 0.0.32 (0.0.30 and below work fine).
# Description: When `navigation.instant` is enabled and a `site_url` is configured in `zensical.toml`,
# a bug occurs where Table of Contents (TOC) links on the right sidebar require two clicks to navigate correctly after a page refresh or running `zensical serve`.
# If I comment out `site_url` or disable `navigation.instant`, the issue disappears and TOC links work normally.
# Note that if I navigate to a different page using the left sidebar first, the bug disappears and TOC links work normally.
# However, after a browser refresh (or `zensical serve`), the bug reappears until a left sidebar navigation occurs.
# I am not a native English speaker, so this information is translated. Please contact me if anything is unclear.
[project]
site_name = "Suffine Hub"
site_url = "https://sufine.top/" # !!!!!!!!!!! Note: Commenting this line out fixes the bug I reported.
site_author = "Luwei"
copyright = "Copyright &copy; 2026 Luwei"
docs_dir = "docs"
site_dir = "site"
edit_uri = "edit/main/docs/"
repo_url = "https://github.com/weigo6/suffine-hub"
repo_name = "weigo6/Sufine Hub"

# extra_javascript = [
#     "javascripts/katex.js",
#     "https://unpkg.com/katex@0/dist/katex.min.js",
#     "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
# ]

# extra_css = [
#     "https://unpkg.com/katex@0/dist/katex.min.css", # KaTeX 样式表
# ]

nav = [
    { "Get started" = "index.md" },
    { "Markdown in 5min" = "markdown.md" },
    { "math" = "math.md" }
]

[project.theme]
variant = "modern"
language = "zh"
font.text = "Noto Sans"
font.code = "JetBrains Mono"
features = [
    "navigation.instant", # Enable instant navigation !!!!!!!!!!! Note: Commenting this line out fixes the bug I reported.
    #"navigation.instant.prefetch", # 启用预加载
    "navigation.instant.progress", # 加载进度条
    "navigation.tracking", # 滚动时URL锚点自动更新
    "navigation.tabs", # 一级导航显示为顶部Tab
    "navigation.tabs.sticky", # 顶部Tab栏粘性显示
    "navigation.sections", # 启用侧边栏章节分组
    "navigation.path", # URL路径导航
    "navigation.indexes", # 导航索引
    "navigation.top", # 返回顶部按钮
    "toc.follow", # 目录跟随滚动
    "search.highlight", # 搜索结果高亮显示
    "content.action.edit", # 编辑此页按钮
    "content.action.view",  # 浏览页面源码按钮
    "navigation.footer", # 启用页脚导航
    "content.code.copy", # 代码块复制按钮
    "content.code.select", # 代码块选择按钮
    "content.code.annotate", # 代码块注释按钮
    "content.footnote.tooltips", # 脚注提示
    "content.tooltips" # 启用内容工具提示
]

